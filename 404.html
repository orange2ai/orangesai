<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>页面不存在 · 冯雷 Orange Feng</title>
<style>
  :root { --bg:#fbf9f6; --ink:#17171a; --muted:#6d6a64; --accent:#e8611c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101011; --ink:#f1eee8; --muted:#9d998f; --accent:#ff8a4c; }
  }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box { max-width: 460px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:.2em; color:var(--muted); }
  h1 { font-family:"Iowan Old Style", Palatino, "Songti SC", Georgia, serif; font-weight:600; font-size:2rem; margin:14px 0 10px; letter-spacing:-.01em; }
  p { color:var(--muted); line-height:1.8; margin:0 0 24px; }
  a { color:inherit; text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; }
  a:hover { color:var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这一页还没写出来。</h1>
    <p>它可能搬了家，也可能从来没有存在过。<br>回到首页看看我在做什么。</p>
    <a href="/">回 orangesai.com</a>
  </div>
</body>
</html>
